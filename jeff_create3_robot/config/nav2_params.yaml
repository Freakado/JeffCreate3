local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.18
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan hazard_points realsense_depth

        scan:
          topic: /JeffCreate3/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          raytrace_max_range: 9.5
          observation_persistence: 5.0

        hazard_points:
          topic: /JeffCreate3/hazard_points
          data_type: "PointCloud2"
          max_obstacle_height: 1.0
          min_obstacle_height: -0.1
          clearing: False         
          marking: True
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

        realsense_depth:
          topic: /JeffCreate3/costmap_cloud   # Downsampled topic
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.08           # Raised from 0.05 to avoid false floor hits on pitch/carpet
          max_obstacle_height: 0.45           # Just under lidar height so they don't fight
          obstacle_max_range: 2.0             # Limit range: camera depth noise spikes >2.0m
          raytrace_max_range: 2.5
          observation_persistence: 0.0        # Set to 0.0 so clearing clears moving legs/cleared zones

        # realsense_depth:
        #   topic: /JeffCreate3/realsense2_camera/depth/color/points
        #   data_type: "PointCloud2"
        #   marking: true
        #   clearing: true
        #   min_obstacle_height: 0.05
        #   max_obstacle_height: 0.50
        #   obstacle_max_range: 2.5
        #   raytrace_max_range: 3.0
        #   inf_is_valid: false
        #   observation_persistence: 5.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0          # Higher value = faster cost drop-off
        inflation_radius: 0.35             # Reduced footprint buffer (40 cm)

planner_server:
  ros__parameters:
    transform_tolerance: 2.0
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: "MOORE"     # CHANGED: "DUBIN" -> "MOORE" (differential-drive 8-connected grid)
      cost_travel_multiplier: 2.0

behavior_server:
  ros__parameters:
    use_sim_time: false
    use_stamped_vel: false
    transform_tolerance: 0.3
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait", "drive_on_heading", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 2.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    use_stamped_vel: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.3
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "circle"
      radius: 0.17                 # Tighter to the actual physical bumper rim
      action_type: "stop"
      min_points: 10                # CHANGED: 3 -> 5 (prevents single-beam noise from triggering an emergency stop)
      visualize: true
      polygon_pub_topic: "polygon_stop"
    observation_sources: ["scan"] # ["scan", "hazard_points"] -> Create3 hazard stream is incidental not continuous. unsuitable. 
    scan:
      type: "scan"
      topic: "/JeffCreate3/scan"
    # hazard_points:
    #   type: "pointcloud"
    #   topic: /JeffCreate3/hazard_points
    #   min_height: -0.05
    #   max_height: 0.30

docking_server:
  ros__parameters:
    use_sim_time: false
    use_stamped_vel: false
    transform_tolerance: 0.3
    controller_frequency: 10.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false