bt_navigator:
  ros__parameters:
    use_sim_time: false
    use_stamped_vel: false
    transform_tolerance: 0.3
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "odometry/filtered"
    #default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_only_if_path_becomes_invalid.xml"
    #default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery.xml"
    bt_loop_duration: 10
    default_server_timeout: 40
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    use_stamped_vel: false
    odom_topic: "odometry/filtered"
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    current_progress_checker: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]
    transform_tolerance: 0.3

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15       # CHANGED: Must move 15 cm
      movement_time_allowance: 6.0         # CHANGED: 15.0 -> 6.0s (aborts spinning quickly)

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35              # CHANGED: 0.25 -> 0.35 gives leeway at frontiers
      yaw_goal_tolerance: 3.14             # No in-place turning requirement on arrival

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      
      # Linear velocity limits (Create 3 max linear speed is ~0.46 m/s, but 0.35–0.40 m/s offers stable control)
      min_vel_x: 0.00
      min_vel_y: 0.00
      max_vel_x: 0.35
      min_speed_xy: 0.03
      max_speed_xy: 0.35
      
      # Angular velocity limits (Create 3 max angular speed is ~1.9 rad/s)
      min_speed_theta: 0.05
      min_vel_theta: -1.2
      max_vel_theta: 1.2
      
      # Acceleration & Deceleration limits
      acc_lim_x: 1.2
      decel_lim_x: -1.5
      acc_lim_theta: 2.0
      decel_lim_theta: -2.0
      
      # Trajectory rollout & sampling
      sim_time: 1.5
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 25
      linear_granularity: 0.03
      angular_granularity: 0.03
      # Classic rotate-to-heading: turn to face path FIRST, then drive straight
      #rotate_to_heading_min_angle: 0.785    # 45 degrees
      #rotate_to_heading_angular_vel: 0.4    # Turn calmly on the spot until aligned
      prune_plan: true
      prune_distance: 0.8
      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist"]
      BaseObstacle:
        scale: 1.0
      PathDist:
        scale: 32.0
      # GoalDist:
      #   scale: 24.0
      PathAlign:
        scale: 32.0
      # GoalAlign:
      #   scale: 0.0
      # RotateToGoal:
      #   scale: 0.0
      #   slowing_factor: 5.0
      #   lookahead_time: -1.0
      # Oscillation:
      #   scale: 0.0
      #   oscillation_reset_dist: 0.05
      #   oscillation_reset_angle: 0.2
      stop_on_failure: true

    # FollowPath:
    #   plugin: "dwb_core::DWBLocalPlanner"
    #   debug_trajectory_details: false
    #   rotate_to_heading_min_angle: 3.14    # Curves along path instead of locking into a pivot
    #   rotate_to_heading_angular_vel: 0.0
    #   prune_plan: true
    #   prune_distance: 0.8
    #   max_angular_accel: 2.0
    #   min_vel_x: 0.05
    #   min_vel_y: 0.0
    #   max_vel_x: 0.22
    #   min_speed_xy: 0.05
    #   max_speed_xy: 0.22
    #   min_speed_theta: 0.0
    #   max_vel_theta: 0.8
    #   min_vel_theta: -0.8
    #   acc_lim_x: 2.0
    #   acc_lim_theta: 2.5
    #   decel_lim_x: -2.0
    #   decel_lim_theta: -2.5
    #   vx_samples: 15                       # CHANGED: 12 -> 15 (more forward speed candidates)
    #   vy_samples: 1
    #   vtheta_samples: 25                   # CHANGED: 20 -> 25 (more turn angles sampled)
    #   disjunct_scale: 0.0
    #   sim_time: 1.0                        # CHANGED: 1.2 -> 1.0 (shorter horizon avoids discarding tight curves)
    #   linear_granularity: 0.05
    #   angular_granularity: 0.025
    #   critics: ["Oscillation", "BaseObstacle", "PathDist", "GoalDist"]
    #   BaseObstacle:
    #     scale: 0.5                         # CHANGED: 0.8 -> 0.5 (stops rejecting valid escaping arcs)
    #   PathDist:
    #     scale: 24.0                        # CHANGED: 32.0 -> 24.0
    #   GoalDist:
    #     scale: 18.0                        # CHANGED: 24.0 -> 18.0
    #   Oscillation:
    #     scale: 2.0
    #     oscillation_reset_dist: 0.05
    #     oscillation_reset_angle: 0.2
    #   stop_on_failure: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    use_stamped_vel: false
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.24, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [2.0, 0.0, 3.0]
    max_decel: [-2.0, 0.0, -3.0]
    odom_topic: "odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_smoothed"

